<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pénzai – Regisztráció</title><link rel="stylesheet" href="auth.css"></head><body><main class="box"><a class="logo" href="index.html"><span class="mark">P</span>Pénzai</a><h1>Fiók létrehozása</h1><p>Kezdd el a Pénzait egyszerűen.</p><form onsubmit="reg(event)"><div class="field"><label>Név</label><input id="name" required></div><div class="field"><label>E-mail cím</label><input id="email" type="email" required></div><div class="field"><label>Jelszó</label><input id="password" type="password" minlength="8" required></div><button class="btn">Regisztráció</button></form><div id="msg" class="notice" style="display:none"></div><a class="back" href="bejelentkezes.html">Már van fiókod? Bejelentkezés</a><a class="back" href="index.html">← Vissza a csomagokhoz</a></main><script>function reg(e){e.preventDefault();document.getElementById('msg').style.display='block';document.getElementById('msg').textContent='A regisztrációs felület elkészült. A valódi fiókok mentéséhez adatbázis és hitelesítési szolgáltatás kell.'}</script></body></html>
