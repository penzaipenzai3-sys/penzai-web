<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pénzai – Ingyen kezdem</title><link rel="stylesheet" href="fiók.css"></head><body><header class="nav"><a class="logo" href="index.html">Pénzai</a></header><main class="wrap"><div class="panel" style="max-width:600px;margin:auto"><span class="badge">0 Ft · Ingyenes</span><h1>Ingyen kezdem</h1><p class="muted">Hozd létre a Pénzai fiókodat, és azonnal beléphetsz az ingyenes csomagba.</p><form id="form"><div class="field"><label for="name">Név</label><input id="name" required autocomplete="name"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Jelszó</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn">Ingyenes fiók létrehozása</button></form><div id="msg" class="notice" style="display:none"></div><p class="muted">Már van fiókod? <a href="bejelentkezes.html" style="color:#a96cff">Bejelentkezés</a></p></div></main><script>
form.addEventListener('submit',function(e){e.preventDefault();
const user={name:name.value.trim(),email:email.value.trim().toLowerCase(),password:password.value,plan:'Ingyenes',createdAt:new Date().toISOString()};
localStorage.setItem('penzaiUser',JSON.stringify(user));localStorage.setItem('penzaiLoggedIn','1');
msg.style.display='block';msg.className='notice success';msg.textContent='Sikeres regisztráció! Átirányítás a fiókodba...';
setTimeout(()=>location.href='fiok.html',500);
});
</script></body></html>
