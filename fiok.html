<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pénzai – Saját fiók</title><link rel="stylesheet" href="fiók.css"></head><body><header class="nav"><a class="logo" href="index.html">Pénzai</a></header><main class="wrap"><div id="app"></div></main><script>
const u=JSON.parse(localStorage.getItem('penzaiUser')||'null');const logged=localStorage.getItem('penzaiLoggedIn')==='1';
if(!u||!logged){location.href='bejelentkezes.html'}else{
app.innerHTML=`<div class="grid"><section class="panel"><span class="badge">● Aktív</span><h1>Szia, ${safe(u.name)}!</h1><p class="muted">Üdvözlünk a saját Pénzai fiókodban.</p><div class="card"><h2>Ingyenes csomag</h2><p class="muted">A hozzáférésed aktív. Ár: <strong>0 Ft</strong>.</p><p>✓ Alap pénzügyi edukáció<br>✓ Kezdő eszközök<br>✓ Közösségi hozzáférés</p></div><br><button class="btn" onclick="logout()">Kijelentkezés</button></section><aside class="panel"><h2>Fiók adatai</h2><p><strong>Név</strong><br>${safe(u.name)}</p><p><strong>E-mail</strong><br>${safe(u.email)}</p><p><strong>Csomag</strong><br>Ingyenes</p></aside></div>`}
function safe(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function logout(){localStorage.removeItem('penzaiLoggedIn');location.href='index.html'}
</script></body></html>
