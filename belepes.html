<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belépés</title><link rel="stylesheet" href="style.css"></head><body><header><a href="index.html">PÉNZAI</a></header><main class="narrow"><h1>Belépés</h1><form onsubmit="login(event)"><input id="e" type="email" required placeholder="E-mail"><input type="password" required placeholder="Jelszó"><button class="btn">Belépés</button></form><p id="m"></p></main><script>function login(x){x.preventDefault();let u=JSON.parse(localStorage.getItem('penzaiUser')||'null');if(u&&u.email===e.value)location.href='fiok.html';else m.textContent='Nincs ilyen helyi profil. Regisztrálj előbb.'}</script></body></html>
