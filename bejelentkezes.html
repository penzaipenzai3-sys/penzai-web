<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pénzai – Belépés</title><link rel="stylesheet" href="fiók.css"></head><body><header class="nav"><a class="logo" href="index.html">Pénzai</a></header><main class="wrap"><div class="panel" style="max-width:600px;margin:auto"><h1>Belépés</h1><p class="muted">Lépj be a Pénzai fiókodba.</p><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Jelszó</label><input id="password" type="password" required></div><button class="btn">Belépés</button></form><div id="msg" class="notice" style="display:none"></div><p class="muted">Nincs még fiókod? <a href="ingyen.html" style="color:#a96cff">Ingyen kezdem</a></p></div></main><script>
form.addEventListener('submit',function(e){e.preventDefault();const u=JSON.parse(localStorage.getItem('penzaiUser')||'null');
if(u&&u.email===email.value.trim().toLowerCase()&&u.password===password.value){localStorage.setItem('penzaiLoggedIn','1');location.href='fiok.html'}else{msg.style.display='block';msg.className='notice error';msg.textContent='Hibás e-mail vagy jelszó.'}});
</script></body></html>
