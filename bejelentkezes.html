<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pénzai – Bejelentkezés</title><link rel="stylesheet" href="auth.css"></head><body><main class="box"><a class="logo" href="index.html"><span class="mark">P</span>Pénzai</a><h1>Bejelentkezés</h1><p>Jelentkezz be a Pénzai fiókodba.</p><form onsubmit="login(event)"><div class="field"><label>E-mail cím</label><input id="email" type="email" required placeholder="te@email.hu"></div><div class="field"><label>Jelszó</label><input id="password" type="password" required placeholder="••••••••"></div><button class="btn">Bejelentkezés</button></form><div id="msg" class="notice" style="display:none"></div><a class="back" href="regisztracio.html">Még nincs fiókod? Regisztráció</a><a class="back" href="index.html">← Vissza a csomagokhoz</a></main><script>function login(e){e.preventDefault();document.getElementById('msg').style.display='block';document.getElementById('msg').textContent='A felület elkészült. A valódi fiók- és jelszókezeléshez szerveroldali hitelesítés szükséges.'}</script></body></html>
